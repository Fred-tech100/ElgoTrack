{% extends "base.html" %}{% load ui static %}
{% block title %}New purchase{% endblock %}{% block heading %}New purchase{% endblock %}
{% block content %}
<div id="editor" data-mode="purchase" data-search-url="{% url 'products:search' %}" data-post-url="{% url 'purchases:create' %}" data-csrf="{{ csrf_token }}" data-decimals="{{ business.currency_decimals }}" class="grid gap-5 lg:grid-cols-[1fr_22rem]">
  <div class="space-y-4"><div class="card card-body"><label class="label" for="q">Add product</label><div class="relative"><input id="q" class="input" autocomplete="off" placeholder="Search name, SKU or barcode…"><div id="results" class="absolute z-10 mt-1 hidden max-h-72 w-full divide-y divide-slate-100 overflow-y-auto rounded-md border border-slate-200 bg-white shadow-lg"></div></div></div>
  <div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Amount</th><th></th></tr></thead><tbody id="lines"></tbody></table></div></div>
  <aside class="card card-body space-y-3">
    <div><label class="label" for="supplier">Supplier</label><select id="supplier" class="input"><option value="">Choose supplier…</option>{% for s in suppliers %}<option value="{{ s.pk }}" {% if initial_supplier == s.pk|stringformat:"s" %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div>
    <div class="grid grid-cols-2 gap-3"><div><label class="label" for="order_date">Order date</label><input id="order_date" type="date" class="input" value="{% now 'Y-m-d' %}"></div><div><label class="label" for="expected_date">Expected</label><input id="expected_date" type="date" class="input"></div></div>
    <div><label class="label" for="supplier_reference">Supplier invoice / reference</label><input id="supplier_reference" class="input" maxlength="60"></div>
    <div><label class="label" for="notes">Notes</label><input id="notes" class="input" maxlength="300"></div>
    <div class="flex justify-between border-t border-slate-200 pt-3 text-lg font-semibold text-brand-900"><span>Total</span><span id="t-total" class="tabular-nums">0</span></div>
    {% if can_receive %}<label class="flex items-start gap-2 text-sm"><input id="receive_now" type="checkbox" class="mt-0.5 h-4 w-4 rounded border-slate-300" checked><span>Goods already received<span class="help block">Adds the stock now and records what you owe the supplier.</span></span></label>{% endif %}
    <p id="form-error" class="alert-error hidden"></p><button id="submit" type="button" class="btn-primary w-full">Save purchase</button></aside>
</div>{% endblock %}
{% block scripts %}<script src="{% static 'js/lineitems.js' %}"></script>{% endblock %}
