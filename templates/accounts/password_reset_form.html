{% extends "auth_base.html" %}{% block title %}Reset password{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold text-brand-900">Forgot your password?</h1>
<p class="mt-1 text-sm text-slate-500">Enter your email and we will send you a reset link.</p>
<form method="post" class="mt-6 space-y-4">{% csrf_token %}{% for field in form %}{% include "components/field.html" %}{% endfor %}<button class="btn-primary w-full">Send reset link</button></form>
<p class="mt-5 text-sm"><a class="link" href="{% url 'accounts:login' %}">Back to sign in</a></p>
{% endblock %}
