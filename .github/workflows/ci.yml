name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: elgonnova}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/elgonnova
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt coverage bandit
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run manage.py test tests && coverage report --fail-under=85
      - run: bandit -q -r . -x ./tests,./node_modules -ll
      - run: SECRET_KEY=x ALLOWED_HOSTS=example.com python manage.py check --deploy
