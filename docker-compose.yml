# ElgonNova Inventory — production-style stack: PostgreSQL, Redis, Django (gunicorn), Celery worker + beat, Nginx.
# Usage:  cp .env.example .env  (set SECRET_KEY, POSTGRES_PASSWORD, ALLOWED_HOSTS)  &&  docker compose up -d --build
x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-elgonnova}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-elgonnova}
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elgonnova}
      POSTGRES_USER: ${POSTGRES_USER:-elgonnova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready/', timeout=4)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 40s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONF:-./deploy/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]          # docker compose --profile backup up -d backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-elgonnova}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-elgonnova}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - ./backups:/backups
      - media_data:/srv/media:ro
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do BACKUP_DIR=/backups MEDIA_DIR=/srv/media /bin/sh /backup.sh; sleep 86400; done"]

volumes:
  pgdata:
  media_data:
  static_data:
