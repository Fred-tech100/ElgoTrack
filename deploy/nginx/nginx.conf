# HTTP-only config: use behind a TLS-terminating load balancer, or for testing. For TLS here, use nginx-tls.conf.example.
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json text/csv image/svg+xml;
  client_max_body_size 6m;                      # attachments are limited to 5 MB in the app

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  upstream django { server web:8000; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;


    location /static/ {
      alias /srv/static/;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # Expense receipts are private financial documents: only the authenticated app view may serve them.
    location /media/expenses/ { return 404; }

    location /media/ {
      alias /srv/media/;
      autoindex off;
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
      expires 7d;
    }

    location = /accounts/login/ {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://django;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
      proxy_pass http://django;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 60s;
    }
  }
}
